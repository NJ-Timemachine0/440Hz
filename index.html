function finish(clear){const before=availableCourses(game.mode);stopAll();endFreeReference();pauseGameClock();phase='result';saveGame(clear);view('result');$('result-title').textContent=clear?(game.diff==='ULTRA'?T('本当のクリア','TRUE CLEAR'):text.clear):text.over;$('result-mode').textContent=`${modeIcon(game.mode)} ${courseLabel(game.diff)}`;$('metrics').replaceChildren();for(const line of [T(`かかった時間：${formatTime(game.elapsed)}`,`Time: ${formatTime(game.elapsed)}`),T(`まちがえた回数：${game.wrong}`,`Mistakes: ${game.wrong}`),T(`やり直した回数：${game.retries}`,`Restarts: ${game.retries}`),T(`チェックポイント：${game.checkpoint}Hz`,`Checkpoint: ${game.checkpoint}Hz`)]){const p=document.createElement('p');p.textContent=line;$('metrics').append(p)}$('unlock-notice')?.remove();const newly=availableCourses(game.mode).filter(d=>!before.includes(d));if(newly.length){const notice=document.createElement('p');notice.id='unlock-notice';notice.textContent=T(`${courseLabel(newly[0])}が解放されました`,`${courseLabel(newly[0])} unlocked`);$('result-title').after(notice)}$('play-ending')?.remove();if(clear&&game.diff==='ULTRA'){const b=endingButton('play-ending',T('演奏を聴く','Hear the performance'),()=>startEnding(game.mode));$('metrics').after(b)}$('resume').classList.toggle('hidden',clear);$('resume').textContent=game.diff==='ULTRA'?T('400Hzから再挑戦','Try again at 400Hz'):text.resume;if(clear&&game.diff!=='ULTRA')[440,554.365,659.255,880].forEach((f,i)=>oscillator(audio,master,f,audio.currentTime+i*.12,2,.12))}
$('start').onclick=()=>startGame();$('continue').onclick=()=>startGame(record().checkpoint);$('listen').onclick=()=>replayReference();$('resume-audio').onclick=()=>resumeInterrupted();$('ready').onclick=()=>{if(phase==='rehearsal')newRound()};$('same').onclick=()=>answer(false);$('different').onclick=()=>answer(true);
// AD SLOT (not integrated): request one midgame ad here, AFTER a result, before restarting/resuming.
// Never on title navigation or first start. Stop audio, disable controls; adFinished/adError resumes.
$('resume').onclick=()=>{difficulty=game.diff;game.diff==='ULTRA'?startGame(400,false,game.mode):startGame(game.checkpoint,true)};$('restart').onclick=()=>{difficulty=game.diff;startGame()};$('result-title-btn').onclick=()=>{stopAll();view('title')};
function interrupt(){if(screen==='ending'){pauseEnding();return}if(screen!=='game'||pausedPhase||phase==='paused')return;pausedPhase=phase;pauseGameClock();saveGame();stopAll();pendingReplay=true;phase='paused';answerButtons(false);$('answers').classList.add('hidden');replayControls();$('status').textContent=text.interrupted}
async function resumeInterrupted(){try{await initAudio()}catch{$('status').textContent=text.soundfail;return}const previous=pausedPhase;pausedPhase=null;pendingReplay=false;if(previous!=='referenceReplay'||hiddenCourse(game.diff))resumeGameClock();if(previous==='referenceReplay'){await replayReference(true);return}if(previous==='feedback'){if(game.hz>=440)finish(true);else if(game.lives<=0)finish(false);else if(game.newSection)rehearsal();else newRound()}else if(['rehearsal','rehearsalPlaying'].includes(previous)||!question)rehearsal();else newRound(true)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)interrupt()});window.addEventListener('pagehide',()=>interrupt());
$('settings').onclick=()=>{settingsWasActive=true;interrupt();$('mode-setting').value=selectedMode;$('settings-dialog').showModal()};$('mode-setting').onchange=()=>{selectedMode=$('mode-setting').value;persist();renderModes();renderDifficulty()};$('close-settings').onclick=()=>$('settings-dialog').close();$('settings-dialog').addEventListener('close',()=>{settingsWasActive=false});
window.addEventListener('keydown',e=>{if(e.repeat||settingsWasActive||screen!=='game'||phase!=='answer')return;if(['w','W','ArrowUp','s','S','ArrowDown'].includes(e.key)){e.preventDefault();answer(['s','S','ArrowDown'].includes(e.key))}});
$('credits').onclick=()=>{const content=$('credits-content');content.replaceChildren();for(const song of allSongs){const c=configFor(song),div=document.createElement('div');div.className='record';const h=document.createElement('strong');h.textContent=song.name;div.append(h);for(const line of c?[c.credit,c.license,c.source,c.attribution||'',T(`元音源 ${c.excerpt[0]}–${c.excerpt[1]}秒から抜粋・音量調整・ゲーム用加工あり。`,`Excerpt ${c.excerpt[0]}–${c.excerpt[1]}s; normalized and processed for this game.`)]:[T('ゲーム内 Web Audio 自前合成（試作品の短い編曲）。録音は使用していません。','Original Web Audio synthesis (short prototype arrangement); no recording used.')]){if(!line)continue;const p=document.createElement('p');p.textContent=line;p.style.overflowWrap='anywhere';div.append(p)}content.append(div)}$('credits-dialog').showModal()};$('close-credits').onclick=()=>$('credits-dialog').close();
// Tests and renderer are deliberately absent unless the local test URL is used.

})();
